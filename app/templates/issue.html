{% extends "base.html" %}{% block title %}Issue Certificate{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-4"><h2>Issue New Certificate</h2><p class="text-muted">SHA-256 hash and RSA signature are generated automatically.</p><form method="post"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Student Name *</label><input name="student_name" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Course *</label><input name="course" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Institution *</label><input name="institution" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Issue Date *</label><input name="issue_date" type="date" value="{{ today }}" class="form-control" required></div></div><div class="mb-4"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div><button class="btn btn-primary">Create & Sign Certificate</button> <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a></form></div></div></div></div>{% endblock %}
